server:
  port: 8080

spring:
  application:
    name: spoken-server
  datasource:
    # 本地 H2 文件库，与迁入的数字人对话代码配套（Flyway 迁移是 H2 语法）。
    # agent 能力后续接起来、要用 MySQL 时，再切 profile 到 dev 并覆盖本段。
    url: jdbc:h2:file:./data/spokenai;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  mvc:
    async:
      # SSE 字幕流是长连接：Servlet 容器默认 30s 就把异步请求掐掉，
      # 表现就是 App 每隔半分钟「事件流中断」一次。放宽到 30 分钟，保活靠用例层心跳。
      request-timeout: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: true

# MyBatis：SQL 全在 resources/mybatis/mapper/*.xml 里。
# 下划线转驼峰打开后，session_id -> sessionId 这类映射不用逐列写 resultMap。
mybatis:
  mapper-locations: classpath*:mybatis/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 数字人对话配置（迁自 spoken-ai）。前缀保持不变，避免改配置契约。
spoken-ai:
  provider:
    # 换数字人后端只改这一行：opentalking
    avatar: opentalking
    opentalking:
      base-url: http://172.18.0.102:8001
      default-avatar-id: anchor
      # flashhead = 1.3B 实时（演示用）
      default-model: flashhead
      connect-timeout-ms: 5000
      request-timeout-ms: 30000
      # 局域网直连：摘掉 stun，避免手机多网卡时等 ICE 收集多花约 7 秒
      drop-stun: true
      expose-models:
        - flashhead
        - flashtalk
      fallback-avatar-ids:
        - anchor
  # 建会话后最多在 HTTP 请求里等多久（超时返回 QUEUED，让 App 轮询/等 SSE）
  ready-wait-ms: 15000
  # 关掉老会话后、建新会话前多等一会儿，等上游把单 GPU 槽放开
  slot-release-settle-ms: 800
  max-sessions-per-device: 1
  session-idle-timeout-ms: 300000
  cors-allowed-origins:
    - "*"

logging:
  level:
    cn.adinall.ai: INFO
    cn.adinall.ai.infrastructure.gateway: INFO
