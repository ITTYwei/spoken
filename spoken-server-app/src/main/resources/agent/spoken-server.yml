# =====================================================================
# spoken-server 模型配置
# ---------------------------------------------------------------------
# 平台      : 云腾AI
# 模型      : tt-5.6-luna（展示名：TT-5.6 luna）
# 家族      : TT
# 类型      : 聊天模型
# 兼容协议  : OpenAI Chat Completions / OpenAI Responses
# 能力标签  : 多轮对话 · 多模态 · 长上下文 · 联网搜索
#
# BASE_URL  : https://api.lk888.ai
# 鉴权      : Authorization: Bearer $API_KEY
# =====================================================================

ai:
  agent:
    config:
      # 是否启用智能体装配。默认 false（没配 agent 也能启动后端）；
      # 走「Java 自己跑 LLM」（spoken-ai.llm-owner=agent）时必须打开。
      enabled: true
      tables:
        spokenServer:
          app-name: spoken-server
          agent:
            agent-id: 100003
            agent-name: 口语教练 SpokenCoach
            agent-desc: 你的专属口语训练教练，陪你练对话、纠发音、润表达，让开口说外语不再尴尬。
          module:
            # 模型接入端点（OpenAI 兼容协议）
            ai-api:
              base-url: https://api.lk888.ai
              # 云腾AI 的 API Key，鉴权：Authorization: Bearer $API_KEY
              # 通过环境变量 LK888_API_KEY 注入（用户级环境变量已配；新进程读不到就 export）。
              api-key: ${LK888_API_KEY:}
              completions-path: v1/chat/completions
              embeddings-path: v1/embeddings
            # 对话模型
            chat-model:
              model: tt-5.6-luna
            # 智能体定义：AgentNode 按这份列表逐个建 LlmAgent（name 是 runner 的入口键）
            agents:
              - name: spokenCoach
                description: 英语口语陪练教练，始终用英语对话，并顺带纠正发音
                instruction: |
                  You are SpokenCoach, a warm and encouraging English speaking coach for Chinese learners of English.
                  Always reply in English only, in one or two short sentences.
                  When the learner's message includes a pronunciation assessment (overall score and the mispronounced words with their expected/heard sounds), briefly point out the most important mistake in a friendly way and give the correct sound.
                  Never repeat the learner's sentence back verbatim. Do not use markdown or emoji.
            # 运行入口：指定要运行的智能体（对应上面 agents 里的 name）
            runner:
              agent-name: spokenCoach
